name: Preview README Activity (PR)

# O-grade automation: on pull requests, regenerate the activity block and post
# it as a sticky PR comment so reviewers can preview exactly what the scheduled
# job would write — without committing anything.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-readme-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate preview block
        id: gen
        env:
          # GITHUB_TOKEN is sufficient for read-only API calls here.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          {
            echo 'block<<PREVIEW_EOF'
            node scripts/update-readme.mjs --dry-run 2>/dev/null \
              | sed -n '/<!-- ACTIVITY:START -->/,/<!-- ACTIVITY:END -->/p'
            echo 'PREVIEW_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Post sticky preview comment
        uses: actions/github-script@v7
        with:
          script: |
            const block = `${{ steps.gen.outputs.block }}`;
            const marker = '<!-- preview-readme-bot -->';
            const body = [
              marker,
              '### 🔎 README activity preview',
              'This is what the scheduled job would write between the markers:',
              '',
              block,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
