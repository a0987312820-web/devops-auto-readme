name: Update README with Activity

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update timestamp in README
        run: |
          echo "Last workflow run: $(date)" > activity-status.txt
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add activity-status.txt
          git commit -m "chore: update activity status [skip ci]" || echo "No changes to commit"
          git push
